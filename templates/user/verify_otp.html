<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email OTP - AC PCB Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --main-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --tech-cyan: #00b4d8;
            --tech-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--main-bg); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .otp-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(0, 180, 216, 0.12);
            color: var(--tech-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 20px auto;
        }

        h2 { font-size: 22px; margin-bottom: 8px; color: var(--text-main); }
        p { font-size: 13.5px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.5; }

        .form-group { margin-bottom: 20px; }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--tech-cyan); }

        .btn-verify {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--tech-cyan), var(--tech-blue));
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-verify:hover { opacity: 0.9; transform: translateY(-1px); }

        .demo-note {
            margin-top: 20px;
            padding: 10px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            font-size: 12px;
            color: var(--tech-cyan);
        }
    </style>
</head>
<body>

    <div class="otp-card">
        <div class="icon-box">
            <i class="fa-solid fa-envelope-circle-check"></i>
        </div>
        
        <h2>Email Verification</h2>
        <p>Enter the 6-digit OTP code sent to <br><strong style="color: var(--text-main);">{{ email or 'your registered email' }}</strong></p>

        <form action="{{ url_for('user_verify_otp') }}" method="POST">
            <!-- Hidden Email Field to preserve parameter on POST -->
            <input type="hidden" name="email" value="{{ email }}">

            <div class="form-group">
                <input type="text" name="otp_code" placeholder="123456" maxlength="6" required autofocus autocomplete="off">
            </div>

            <button type="submit" class="btn-verify">Verify OTP</button>
        </form>

        <div class="demo-note">
            <i class="fa-solid fa-circle-info"></i> Testing Tip: Enter <strong>123456</strong> to bypass verification instantly!
        </div>
    </div>

</body>
</html>
