<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician Register - AC PCB Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --main-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --tech-cyan: #00b4d8;
            --tech-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--main-bg); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-header h2 { font-size: 24px; color: var(--text-main); margin-bottom: 6px; }
        .auth-header p { font-size: 13.5px; color: var(--text-muted); }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .form-group input {
            padding: 11px 14px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus { border-color: var(--tech-cyan); }

        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--tech-cyan);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #0096c7; }

        .auth-footer { text-align: center; margin-top: 20px; font-size: 13.5px; color: var(--text-muted); }
        .auth-footer a { color: var(--tech-cyan); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h2><i class="fa-solid fa-user-gear" style="color: var(--tech-cyan);"></i> Technician Sign Up</h2>
            <p>Register to generate estimate bills and track PCB repairs</p>
        </div>

        <form action="/user/register" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email Address (for OTP verification)</label>
                <input type="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>Mobile Phone Number</label>
                <input type="tel" name="phone" placeholder="10-digit mobile number" required>
            </div>

            <div class="form-group">
                <label>Shop / Business Name</label>
                <input type="text" name="shop_name" placeholder="e.g. Radhe AC Care" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" name="city" placeholder="City" required>
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" name="state" placeholder="State" required>
                </div>
            </div>

            <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Send Email OTP</button>
        </form>

        <div class="auth-footer">
            Already registered? <a href="/login">Login here</a>
        </div>
    </div>

</body>
</html>
