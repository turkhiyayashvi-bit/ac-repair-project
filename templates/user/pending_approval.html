<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Pending Approval - AC PCB Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --main-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --tech-cyan: #00b4d8;
            --tech-orange: #f59e0b;
            --tech-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--main-bg); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .approval-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--tech-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px auto;
        }

        .approval-card h2 { font-size: 22px; color: var(--text-main); margin-bottom: 10px; }
        .approval-card p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 25px; }

        .status-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 13px;
            color: var(--text-main);
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-row { display: flex; justify-content: space-between; }
        .status-label { color: var(--text-muted); }
        .badge-pending { color: var(--tech-orange); font-weight: 700; }
        .badge-verified { color: var(--tech-green); font-weight: 700; }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--tech-cyan);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .btn-home:hover { background: #0096c7; }
    </style>
</head>
<body>

    <div class="approval-card">
        <div class="icon-box">
            <i class="fa-solid fa-user-clock"></i>
        </div>

        <h2>Approval Pending</h2>
        <p>Your technician account has been created and email verified. Full access to Live Repair Tracking is currently under review by the Admin.</p>

        <div class="status-box">
            <div class="status-row">
                <span class="status-label">Email OTP Verification:</span>
                <span class="badge-verified"><i class="fa-solid fa-circle-check"></i> Verified</span>
            </div>
            <div class="status-row">
                <span class="status-label">Admin Approval Status:</span>
                <span class="badge-pending"><i class="fa-solid fa-clock"></i> Pending Approval</span>
            </div>
        </div>

        <a href="/user" class="btn-home"><i class="fa-solid fa-house"></i> Return to Home</a>
    </div>

</body>
</html>
